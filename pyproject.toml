[project]
name = "terrain-search-assistant"
version = "0.1.0"
description = "Local operator support for missing-person search over drone video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "folium>=0.18.0",
    "streamlit-folium>=0.23.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.9.0",
    "pyproj>=3.7.0",
    "shapely>=2.0.0",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-Pillow>=10.0.0",
]
yolo = [
    "ultralytics>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrain_search_assistant"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-Pillow>=10.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["terrain_search_assistant"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "folium.*",
    "folium.plugins.*",
    "streamlit_folium.*",
    "streamlit.*",
    "shapely.*",
    "ultralytics",
    "ultralytics.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
